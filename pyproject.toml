[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "divoom-widgets"
version = "0.3.0"
description = "Widget framework for the Divoom Times Gate: Claude usage, home energy, and more"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "divoom-widgets contributors" }]
keywords = ["divoom", "times-gate", "pixoo", "claude", "usage", "widget"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
dependencies = [
    "Pillow>=10.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
keeper = ["pystray>=0.19"]
dev = ["pytest>=7.0"]

[project.scripts]
divoom-widgets = "divoom_widgets.__main__:main"
divoom-usage-widget = "usage_widget.__main__:main"
divoom-keeper = "divoom_keeper.__main__:main"

[tool.setuptools]
packages = ["divoom_widgets", "divoom_widgets.widgets", "usage_widget", "divoom_keeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
