[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "divoom-widgets"
version = "0.2.0"
description = "Show Claude usage (session + weekly limits) on a Divoom Times Gate pixel display"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Cosmin Cucu" }]
keywords = ["divoom", "times-gate", "pixoo", "claude", "usage", "widget"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]
dependencies = [
    "Pillow>=10.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
keeper = ["pystray>=0.19"]
dev = ["pytest>=7.0"]

[project.scripts]
divoom-usage-widget = "usage_widget.__main__:main"
divoom-keeper = "divoom_keeper.__main__:main"

[project.urls]
Homepage = "https://github.com/cosmincucu/divoom-widgets"

[tool.setuptools]
packages = ["usage_widget", "divoom_keeper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
